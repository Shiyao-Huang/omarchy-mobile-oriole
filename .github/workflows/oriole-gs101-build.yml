name: Oriole GS101 kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: Build pinned GS101 kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison flex libelf-dev libssl-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 rsync cpio clang llvm lld kmod

      - name: Check out the exact GS101 source
        uses: actions/checkout@v4
        with:
          repository: m8l8th814n-eng/gs101-mainline
          ref: 850061c79264d018317e9f849701f165e138e20c
          path: build/kernel

      - name: Check out the exact Nura patch source
        uses: actions/checkout@v4
        with:
          repository: TheNoswad/pixel6-mainline-nura
          ref: a74e18dec7598f65cd504f0c75c10b8d7fc4422b
          path: build/nura

      - name: Apply the pinned Oriole patch series
        run: tools/prepare-oriole-kernel --apply "$GITHUB_WORKSPACE/build/nura" "$GITHUB_WORKSPACE/build/kernel"

      - name: Apply the verified GS101 Panfrost cold-start fix
        working-directory: build/kernel
        run: |
          mmu=drivers/gpu/drm/panfrost/panfrost_mmu.c
          python3 "$GITHUB_WORKSPACE/experiments/test-gpu-g15-mmu.py" "$mmu"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          python3 "$GITHUB_WORKSPACE/experiments/apply-gpu-g15.py" "$mmu" "$tmp/mmu.c"
          mv "$tmp/mmu.c" "$mmu"
          sha256sum "$mmu" | tee "$GITHUB_WORKSPACE/panfrost-mmu-g15.sha256"

      - name: Build the reference configuration and all external hardware modules
        run: |
          LLVM=1 JOBS="$(nproc)" tools/build-oriole-kernel \
            "$GITHUB_WORKSPACE/build/nura" "$GITHUB_WORKSPACE/build/kernel" \
            "$GITHUB_WORKSPACE/build/artifacts" 2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"

      - name: Upload non-sensitive build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oriole-gs101-build-evidence
          if-no-files-found: ignore
          path: |
            kernel-build.log
            panfrost-mmu-g15.sha256
            build/artifacts/config
            build/artifacts/kernel.release
            build/artifacts/Image
            build/artifacts/gs101-oriole.dtb
            build/artifacts/modules.tar.gz
            build/artifacts/SHA256SUMS
