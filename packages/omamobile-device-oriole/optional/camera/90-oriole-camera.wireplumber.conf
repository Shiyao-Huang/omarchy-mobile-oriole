# Raw Bayer CSIS nodes are inputs to libcamera, not user-facing V4L2 cameras.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.platform-*.mipi-csis" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
