# BCM4389 creates Android-only helper interfaces. NetworkManager must manage
# wlan0 only; touching these helpers can make the driver re-add an ifidx while
# rtnl is held and hang networking.
[keyfile]
unmanaged-devices=interface-name:wlan1;interface-name:aware_nmi0;interface-name:radiotap0
